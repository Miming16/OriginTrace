services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: origintrace
      POSTGRES_USER: origintrace
      POSTGRES_PASSWORD: origintrace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origintrace -d origintrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://origintrace:origintrace@db:5432/origintrace
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: